name: GarmentOS Cloud CI

on:
  push:
    branches:
      - main
      - 'garmentos/**'
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Security & ERP Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: garmentos_test
          POSTGRES_USER: garmentos
          POSTGRES_PASSWORD: secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garmentos -d garmentos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      APP_ENV: testing
      APP_KEY: base64:sO8K34pEwH7X/jR18O5E9u2+xXy3Z8e9fG4H5J6K7L8=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      PGSQL_HOST: 127.0.0.1
      PGSQL_PORT: 5432
      PGSQL_DATABASE: garmentos_test
      PGSQL_USERNAME: garmentos
      PGSQL_PASSWORD: secret_test_password
      ALLOW_DESTRUCTIVE_PG_TEST_CLEANUP: 'true'
      PAYMENT_WEBHOOK_SECRET: test_payment_webhook_secret_key_must_be_over_32_chars_long
      PLATFORM_ADMIN_ACTIVATION_KEY: test_platform_admin_super_secret_activation_key_32_chars

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_pgsql, pgsql, bcmath
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install PostgreSQL 16 client utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          pg_dump --version
          pg_restore --version

      - name: Prepare Test Environment
        run: |
          printf "%s\n" \
            "APP_ENV=testing" \
            "APP_KEY=base64:sO8K34pEwH7X/jR18O5E9u2+xXy3Z8e9fG4H5J6K7L8=" \
            "DB_CONNECTION=sqlite" \
            "DB_DATABASE=:memory:" \
            "PGSQL_HOST=127.0.0.1" \
            "PGSQL_PORT=5432" \
            "PGSQL_DATABASE=garmentos_test" \
            "PGSQL_USERNAME=garmentos" \
            "PGSQL_PASSWORD=secret_test_password" \
            "ALLOW_DESTRUCTIVE_PG_TEST_CLEANUP=true" \
            "PAYMENT_WEBHOOK_SECRET=test_payment_webhook_secret_key_must_be_over_32_chars_long" \
            "STRIPE_WEBHOOK_SECRET=whsec_test_stripe_webhook_secret_key_over_32_characters" \
            "PAYMOB_HMAC_SECRET=test_paymob_hmac_secret_key_must_be_over_32_characters_long" \
            "PLATFORM_ADMIN_ACTIVATION_KEY=test_platform_admin_super_secret_activation_key_32_chars" \
            "REQUIRE_POSTGRES_CONCURRENCY_TESTS=true" \
            > .env
          cp .env .env.testing
          echo "ALLOW_DESTRUCTIVE_PG_TEST_CLEANUP=true" >> $GITHUB_ENV

      - name: Run Database Migrations on PostgreSQL
        run: php artisan migrate --database=pgsql -v --force

      - name: Run PostgreSQL Concurrency Integration Tests
        run: php artisan test --filter=PostgresConcurrencyIntegrationTest

      - name: Run Complete Backend Test Suite
        run: |
          set +e
          php artisan test --colors=never 2>&1 | tee /tmp/full_test.log
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ $exit_code -ne 0 ]; then
            echo "::error title=Backend Tests Failed::$(grep -E '(FAIL|Failed|Error|Exception)' /tmp/full_test.log | head -n 30 | tr '\r\n' ' ')"
            exit $exit_code
          fi

      - name: Seed committed data for PostgreSQL backup verification
        env:
          DB_CONNECTION: pgsql
        run: |
          php artisan tinker --execute='app("db")->table("tenants")->insert(["id" => "00000000-0000-4000-8000-000000000001", "name" => "PostgreSQL Backup Verification Tenant", "code" => "BACKUP-VERIFY-PG", "subdomain" => "backup-verify-pg", "status" => "active", "created_at" => now(), "updated_at" => now()]);'

      - name: Create and verify a real PostgreSQL backup
        env:
          DB_CONNECTION: pgsql
        run: |
          php artisan garmentos:backup --destination=local
          BACKUP_ID="$(php -r '$files=glob("storage/app/private/backups/database/*.manifest.json"); rsort($files); $m=$files ? json_decode(file_get_contents($files[0]), true) : []; echo $m["backup_id"] ?? "";')"
          test -n "$BACKUP_ID"
          php artisan garmentos:verify-backup "$BACKUP_ID"
          echo "GARMENTOS_PG_BACKUP_ID=$BACKUP_ID" >> "$GITHUB_ENV"

      - name: Restore PostgreSQL backup into a new isolated database
        env:
          DB_CONNECTION: pgsql
          RESTORE_DB: garmentos_restore_test_${{ github.run_id }}_${{ github.run_attempt }}
        run: php artisan garmentos:restore "$GARMENTOS_PG_BACKUP_ID" --target-db="$RESTORE_DB" --force

      - name: Prove PostgreSQL restore refuses the active database
        env:
          DB_CONNECTION: pgsql
        run: |
          set +e
          php artisan garmentos:restore "$GARMENTOS_PG_BACKUP_ID" --target-db=garmentos_test --force
          RESTORE_EXIT=$?
          set -e
          test "$RESTORE_EXIT" -eq 1

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Typecheck and Build Frontend
        run: npm run build
