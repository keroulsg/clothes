name: GarmentOS Cloud CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Security & ERP Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: garmentos_test
          POSTGRES_USER: garmentos
          POSTGRES_PASSWORD: secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garmentos -d garmentos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      APP_ENV: testing
      APP_KEY: base64:sO8K34pEwH7X/jR18O5E9u2+xXy3Z8e9fG4H5J6K7L8=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      PGSQL_HOST: 127.0.0.1
      PGSQL_PORT: 5432
      PGSQL_DATABASE: garmentos_test
      PGSQL_USERNAME: garmentos
      PGSQL_PASSWORD: secret_test_password
      PAYMENT_WEBHOOK_SECRET: test_payment_webhook_secret_key_must_be_over_32_chars_long
      PLATFORM_ADMIN_ACTIVATION_KEY: test_platform_admin_super_secret_activation_key_32_chars

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_pgsql, pgsql, bcmath
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Test Environment
        run: |
          printf "%s\n" \
            "APP_ENV=testing" \
            "APP_KEY=base64:sO8K34pEwH7X/jR18O5E9u2+xXy3Z8e9fG4H5J6K7L8=" \
            "DB_CONNECTION=sqlite" \
            "DB_DATABASE=:memory:" \
            "PGSQL_HOST=127.0.0.1" \
            "PGSQL_PORT=5432" \
            "PGSQL_DATABASE=garmentos_test" \
            "PGSQL_USERNAME=garmentos" \
            "PGSQL_PASSWORD=secret_test_password" \
            "PAYMENT_WEBHOOK_SECRET=test_payment_webhook_secret_key_must_be_over_32_chars_long" \
            "PLATFORM_ADMIN_ACTIVATION_KEY=test_platform_admin_super_secret_activation_key_32_chars" \
            > .env
          cp .env .env.testing

      - name: Run Database Migrations on PostgreSQL
        run: php artisan migrate --database=pgsql -v --force

      - name: Run Backend Tests
        run: php artisan test

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Typecheck and Build Frontend
        run: npm run build
