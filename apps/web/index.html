<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GarmentOS Cloud | المنظومة السحابية لإدارة مصانع وورش الملابس</title>
    <meta name="description" content="منظومة سحابية متخصصة لإدارة صالات القص، تتبع حزم الإنتاج بالباركود، إدارة المخازن والأقمشة، وعقود التشغيل للغير CMT مع عزل آمن للبيانات." />
    <!-- Google Fonts: Cairo & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Immediate theme initialization to prevent UI flashing on initial load -->
    <script>
      (function () {
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var urlTheme = urlParams.get('theme');
          var saved = localStorage.getItem('garmentos_theme');
          var isDark = urlTheme ? (urlTheme === 'dark') : (saved ? (saved === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.setAttribute('data-coreui-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.setAttribute('data-coreui-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
